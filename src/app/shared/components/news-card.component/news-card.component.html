<article class="news-card">
  <!-- Izquierda -->
  <div class="news-card__image-container">
    <img [src]="imageSrc" [alt]="imageAlt || title" class="news-card__image">
  </div>

  <!-- Derecha -->
  <div class="news-card__content">
    <h3 class="news-card__title">{{ title }}</h3>
    <p class="news-card__description">{{ description }}</p>
    
    <!-- Fila de abajo (Etiqueta + Fecha) -->
    <div class="news-card__meta">
      @if (label) {
        <span class="news-card__label">{{ label }}</span>
      }
      <span class="news-card__date">{{ date }}</span>
    </div>
  </div>
</article>
